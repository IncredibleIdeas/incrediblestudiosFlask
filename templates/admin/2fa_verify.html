<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2FA Verification - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="min-h-screen flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-xl p-8 w-full max-w-md">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-[#6C63FF]">Two-Factor Authentication</h1>
                <p class="text-gray-600 mt-2">Enter the code from your authenticator app</p>
            </div>
            <form method="POST" action="{{ url_for('verify_2fa_login') }}">
                <div class="mb-6">
                    <label class="block text-gray-700 text-sm font-bold mb-2">Verification Code</label>
                    <input type="text" name="token" required placeholder="000000" class="w-full px-4 py-2 border rounded-lg text-center text-2xl tracking-widest focus:outline-none focus:border-[#6C63FF]">
                </div>
                <button type="submit" class="w-full bg-[#6C63FF] text-white py-3 rounded-lg hover:bg-opacity-90 transition">Verify</button>
            </form>
        </div>
    </div>
</body>
</html>
