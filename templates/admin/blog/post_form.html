{% extends "admin/base.html" %}

{% block content %}
<div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-800">{% if post %}Edit Post{% else %}New Post{% endif %}</h1>
</div>

<form method="POST" class="bg-white rounded-xl shadow-sm p-6">
    <div class="grid lg:grid-cols-3 gap-8">
        <div class="lg:col-span-2">
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Title *</label>
                <input type="text" name="title" value="{{ post.title if post else '' }}" required class="w-full px-3 py-2 border rounded-lg">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Slug (URL)</label>
                <input type="text" name="slug" value="{{ post.slug if post else '' }}" class="w-full px-3 py-2 border rounded-lg">
                <p class="text-xs text-gray-500">Leave empty to auto-generate from title</p>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Excerpt</label>
                <textarea name="excerpt" rows="3" class="w-full px-3 py-2 border rounded-lg">{{ post.excerpt if post else '' }}</textarea>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Content *</label>
                <textarea name="content" rows="20" required class="w-full px-3 py-2 border rounded-lg font-mono text-sm">{{ post.content if post else '' }}</textarea>
                <p class="text-xs text-gray-500 mt-1">HTML supported</p>
            </div>
        </div>
        <div>
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Featured Image URL</label>
                <input type="text" name="featured_image" value="{{ post.featured_image if post else '' }}" class="w-full px-3 py-2 border rounded-lg">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Category</label>
                <select name="category_id" class="w-full px-3 py-2 border rounded-lg">
                    <option value="">None</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}" {% if post and post.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Tags (comma-separated)</label>
                <input type="text" name="tags" value="{{ tag_string if post else '' }}" class="w-full px-3 py-2 border rounded-lg" placeholder="design, web, branding">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Status</label>
                <select name="status" id="status" class="w-full px-3 py-2 border rounded-lg">
                    <option value="draft" {% if post and post.status == 'draft' %}selected{% endif %}>Draft</option>
                    <option value="published" {% if post and post.status == 'published' %}selected{% endif %}>Publish Now</option>
                    <option value="scheduled" {% if post and post.status == 'scheduled' %}selected{% endif %}>Schedule</option>
                </select>
            </div>
            <div class="mb-4" id="schedule-field" style="display: none;">
                <label class="block text-sm font-medium mb-1">Schedule Date & Time</label>
                <input type="datetime-local" name="scheduled_date" value="{{ post.scheduled_for.strftime('%Y-%m-%dT%H:%M') if post and post.scheduled_for else '' }}" class="w-full px-3 py-2 border rounded-lg">
            </div>
            <hr class="my-4">
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">SEO Title</label>
                <input type="text" name="seo_title" value="{{ post.seo_title if post else '' }}" class="w-full px-3 py-2 border rounded-lg">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">SEO Description</label>
                <textarea name="seo_description" rows="2" class="w-full px-3 py-2 border rounded-lg">{{ post.seo_description if post else '' }}</textarea>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">SEO Keywords</label>
                <input type="text" name="seo_keywords" value="{{ post.seo_keywords if post else '' }}" class="w-full px-3 py-2 border rounded-lg" placeholder="keyword1, keyword2, keyword3">
            </div>
        </div>
    </div>
    <div class="flex justify-end gap-3 pt-6 border-t mt-6">
        <a href="{{ url_for('admin_blog') }}" class="px-4 py-2 border rounded-lg">Cancel</a>
        <button type="submit" class="px-4 py-2 bg-[#6C63FF] text-white rounded-lg">{% if post %}Update{% else %}Create{% endif %} Post</button>
    </div>
</form>

<script>
document.getElementById('status').addEventListener('change', function() {
    document.getElementById('schedule-field').style.display = this.value === 'scheduled' ? 'block' : 'none';
});
</script>
{% endblock %}
